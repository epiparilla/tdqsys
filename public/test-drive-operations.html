<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TDQSYS Test Drive Operations</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{padding:24px}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
    nav{display:flex;gap:8px;margin:20px 0}button,input{font:inherit;padding:8px}
    #board{display:grid;grid-template-columns:repeat(var(--model-count,1),minmax(100px,1fr));gap:8px;overflow-x:auto}
    article{background:#172033;border:1px solid #536078;border-radius:8px;padding:10px}
    h2{font-size:16px}.entry{border-top:1px solid #536078;padding:10px 0}
    .entry strong{font-size:22px}.actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
    .actions button{font-size:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #536078}
    #message{min-height:24px;color:#fbbf24}[hidden]{display:none!important}
  </style>
</head>
<body>
  <header><h1>Test Drive Operations</h1><a href="index.html">Hub</a><a href="display_with_ads.html" target="_blank">Display</a><button id="refresh">Refresh</button></header>
  <p id="message" role="status"></p><p id="run"></p>
  <details><summary>Event setup and registration QR codes</summary>
    <p>Save the vehicle shortnames, waiver, and Terms in System Settings first.</p>
    <button id="configure">Sync saved Settings to registration forms</button>
    <div id="registration-links" style="display:flex;gap:24px;flex-wrap:wrap"></div>
    <button id="export">Download registrant backup (CSV)</button>
    <form id="reset-form"><label>Reset reason <input id="reset-reason" value="Testing" maxlength="240" required></label>
      <label><input id="reset-confirm" type="checkbox" required> Close this run and start a new queue from zero. Keep all client history.</label>
      <button type="submit">Reset to Zero / open run</button></form>
  </details>
  <nav aria-label="Operations views"><button data-view="board">Queue board</button><button data-view="master">Master table</button><button data-view="prints">Print Queue</button></nav>
  <main><section id="board"></section><section id="master" hidden><label>Search client name <input id="search" type="search"></label><label><input id="history" type="checkbox"> Earlier runs today</label><table><thead><tr><th>Queue</th><th>Name</th><th>Model</th><th>Status</th><th>Actions</th></tr></thead><tbody id="master-rows"></tbody></table></section>
  <section id="prints" hidden><label>Label printer <select id="printer"><option value="">Select printer</option></select></label><button id="load-printers">Refresh printer list</button><table><thead><tr><th>Queue</th><th>Name</th><th>Model / type</th><th>Print status</th><th>Action</th></tr></thead><tbody id="print-rows"></tbody></table></section></main>
  <script src="vendor/qrcode-generator.js"></script><script src="test-drive-operations.js"></script>
</body>
</html>
