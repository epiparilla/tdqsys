<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TDQSYS Agent Registration</title>
  <style>
    body{margin:0;background:#0b1220;color:#edf2f7;font:16px system-ui,sans-serif}.card{max-width:480px;margin:3rem auto;padding:1.5rem;background:#172033;border-radius:16px}label{display:block;margin-top:1rem;font-weight:700}input,select,button{box-sizing:border-box;width:100%;margin-top:.35rem;padding:.8rem;border-radius:8px;border:1px solid #536078;font:inherit}button{background:#d71920;color:#fff;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.error{color:#ffb4b4}.success{color:#b8f5cf;white-space:pre-line}
  </style>
</head>
<body><main class="card"><h1>Agent Registration</h1><p>Register for today&apos;s test-drive event.</p>
  <form id="form"><label>Name<input name="name" autocomplete="name" required></label><label>Contact No.<input name="contactNumber" type="tel" inputmode="numeric" autocomplete="tel" pattern="[0-9]{11}" minlength="11" maxlength="11" title="Enter exactly 11 digits (numbers only), e.g. 09171234567" required></label><label>Dealership<select name="dealership" required disabled><option value="">Loading dealerships...</option></select></label><button disabled>Get my code</button></form><p id="message" role="status"></p>
</main><script src="se-registration.js"></script></body></html>
