    <h1 style="margin-bottom: 1rem; font-family: 'Syncopate', sans-serif;">TDQSYS QUEUE SYSTEM</h1>

    <div style="display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center;">
        <a href="dashboard.html" class="link-button" style="padding: 1.5rem 2rem; font-size: 1.2rem;">
            &#x1F5A5;&#xFE0F; Facilitator Dashboard
        </a>

        <a href="display_with_ads.html" target="_blank" class="link-button" style="padding: 1.5rem 2rem; font-size: 1.2rem;">

        <a href="client.html" target="_blank" class="link-button" style="padding: 1.5rem 2rem; font-size: 1.2rem;">

    <div id="update-pill" style="display:none; margin-top:1rem; padding:0.6rem 1.2rem; border:1px solid #EB0A1E; border-radius:999px; font-size:0.9rem;">
        &#x2B07; <a href="settings.html" style="color:#fff; text-decoration:underline;">New version available</a>
    </div>

</body>
<script>
    // Live update notification bridge (only present inside the desktop app).
    if (window.afDesktop && window.afDesktop.onUpdateAvailable) {
        window.afDesktop.onUpdateAvailable((info) => {
            if (info && info.updateAvailable) {
                document.getElementById('update-pill').style.display = 'block';
            }
        });
    }
</script>
