<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDQSYS Queue Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; text-align: center; gap: 1rem;">

    <h1 style="margin-bottom: 1rem; font-family: 'Syncopate', sans-serif;">TDQSYS QUEUE SYSTEM</h1>

    <!--
        ONE file, TWO audiences. video_server.js serves this same page for the
        local engine's "/" and main.js opens it in the desktop app, while
        Cloudflare Pages serves it as the public website. So the local-only
        links are marked data-hub="local" and removed below when the page is
        NOT on the local box - the website publishes only the phone viewer,
        the local hub keeps the full set.
    -->
    <div id="hub-links" style="display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center;">
        <a data-hub="local" href="dashboard.html" class="link-button" style="padding: 1.5rem 2rem; font-size: 1.2rem;">
            &#x1F5A5;&#xFE0F; Facilitator Dashboard
        </a>

        <a data-hub="local" href="display_with_ads.html" target="_blank" class="link-button" style="padding: 1.5rem 2rem; font-size: 1.2rem;">
            &#x1F4E2; TV Display + Video Ads
        </a>

        <!-- The ?id= is REQUIRED on the cloud: without it the viewer has no
             instance to read and refuses to guess a location. Locally it is
             ignored - the engine is already this location's live data. -->
        <a href="client.html?id=8c8b6714-f300-413f-bf75-e1156662acfb" target="_blank" class="link-button" style="padding: 1.5rem 2rem; font-size: 1.2rem;">
            &#x1F4F1; Mobile Status Viewer
        </a>
    </div>

    <script>
        // Runs synchronously right after the links are parsed, so the local-only
        // buttons are gone before the page paints.
        (function () {
            var host = window.location.hostname;
            var local = !host                                   // file:// or app protocol
                || host === 'localhost'
                || host === '127.0.0.1'
                || host === '[::1]'
                || !!window.afDesktop;                          // inside the desktop app
            if (!local) {
                try {
                    local = host === (localStorage.getItem('af_hostname') || 'tdqsys.local');
                } catch (e) {
                    local = host === 'tdqsys.local';
                }
            }
            if (local) return;
            var extra = document.querySelectorAll('[data-hub="local"]');
            for (var i = 0; i < extra.length; i++) extra[i].parentNode.removeChild(extra[i]);
        })();
    </script>

    <!-- Last-resort escape hatch. Settings is where software updates live, so a
         hub that hides it can strand someone on an old build with no way out.
         This one is deliberately NOT data-hub="local" and is never removed. On
         the website it is simply a small footer link. -->
    <noscript>
        <p style="margin-top:1.5rem;"><a href="settings.html" class="link-button">Settings</a></p>
    </noscript>

    <div id="update-pill" style="display:none; margin-top:1rem; padding:0.6rem 1.2rem; border:1px solid #EB0A1E; border-radius:999px; font-size:0.9rem; cursor:pointer;" onclick="updateNow()">
        &#x2B07; <span style="color:#fff; text-decoration:underline;">New version available - click to update</span>
    </div>
    <div id="update-pill-progress" style="display:none; margin-top:0.5rem; font-size:0.8rem; opacity:0.85;"></div>

    <p style="margin-top:1.5rem; font-size:0.8rem; opacity:0.6;">
        <a href="settings.html" style="color:inherit;">Settings</a>
    </p>

</body>
<script>
    function updateNow() {
        const prog = document.getElementById('update-pill-progress');
        if (!prog) return;
        if (window.afDesktop && window.afDesktop.installUpdate) {
            prog.style.display = 'block';
            prog.textContent = 'Downloading update\u2026';
            window.afDesktop.installUpdate()
                .then((r) => { prog.textContent = (r && r.ok) ? 'Installing\u2026' : ('Update failed: ' + ((r && r.error) || 'open Settings to retry')); })
                .catch((e) => { prog.textContent = 'Update failed: ' + e.message; });
        } else {
            window.location.href = 'settings.html';
        }
    }

    // Live update notification bridge (only present inside the desktop app).
    if (window.afDesktop && window.afDesktop.onUpdateAvailable) {
        window.afDesktop.onUpdateAvailable((info) => {
            if (info && info.updateAvailable) {
                document.getElementById('update-pill').style.display = 'block';
            }
        });
    }
    if (window.afDesktop && window.afDesktop.onUpdateProgress) {
        window.afDesktop.onUpdateProgress((p) => {
            const prog = document.getElementById('update-pill-progress');
            if (!prog) return;
            prog.style.display = 'block';
            if (p.state === 'download') prog.textContent = 'Downloading update\u2026 ' + (p.percent != null ? p.percent + '%' : '');
            else if (p.state === 'installing') prog.textContent = 'Installing\u2026 TDQSYS will restart.';
            else if (p.state === 'error') prog.textContent = 'Update failed. Open Settings to retry.';
        });
    }
</script>
</html>
