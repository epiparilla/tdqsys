<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyota Auto Focus</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style="overflow: hidden;">

    <!-- Fallback fullscreen button (auto-hides once fullscreen activates) -->
    <div id="fs-prompt" onclick="goFullscreen()" style="position:fixed; bottom:20px; right:20px; z-index:99999; background:rgba(0,0,0,0.7); color:white; padding:10px 18px; border-radius:8px; cursor:pointer; font-family:Inter,sans-serif; font-size:0.9rem; border:1px solid rgba(255,255,255,0.3); transition:opacity 0.5s;">
        ⛶ Click to Fullscreen
    </div>

    <!-- AUTOPLAY UNLOCK OVERLAY (Industry standard for digital signage to bypass browser restrictions) -->
    <div id="start-overlay" onclick="startDisplay()" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:var(--bg-main); z-index:999999; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white; font-family:Inter,sans-serif; cursor:pointer; text-align:center;">
        <h1 style="font-size: 3rem; margin-bottom: 1rem;">TV DISPLAY SYSTEM</h1>
        <p style="font-size: 1.5rem; opacity: 0.7;">Click anywhere to start the queue and enable video ads.</p>
    </div>

    <!-- FULL SCREEN AD OVERLAY (Translucent so queue shows through) -->
    <div id="video-overlay"
        style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0, 0, 0, 1); z-index:9999; opacity:1; transition: opacity 0.5s ease;">
        <video id="ad-video" style="width:100%; height:100%; object-fit:contain; background:transparent;"></video>
    </div>

    <!-- STANDARD QUEUE DISPLAY SYSTEM -->
    <div class="stacked-container">
        <!-- TOYOTA SECTION -->
        <main class="brand-section toyota-section">
            <header class="brand-header">
                <h1>TOYOTA</h1>
            </header>
            <div class="queue-grid" id="toyota-grid">
                <!-- Javascript will populate units -->
            </div>
        </main>

        <!-- LEXUS SECTION -->
        <main class="brand-section lexus-section">
            <header class="brand-header">
                <h1>LEXUS</h1>
            </header>
            <div class="queue-grid" id="lexus-grid">
                <!-- Javascript will populate units -->
            </div>
        </main>
    </div>

    <script>
        // --------- QUEUE SYSTEM LOGIC ---------
        const brands = ['lexus', 'toyota'];
        let localData = { lexus: {}, toyota: {} };
        let lastLocalUpdate = 0; // Prevent polling race conditions

        // --------- VOICE SYSTEM LOGIC ---------
        let voiceEnabled = false;
        const audioQueue = [];
        let isPlaying = false;

        function announceNumber(displayValue) {
            if (!voiceEnabled) return;
            const url = `http://localhost:8000/api/speak_unit?voice=af_heart&unit=${encodeURIComponent(displayValue)}`;
            audioQueue.push(url);
            playNextAudio();
        }

        function playNextAudio() {
            if (isPlaying || audioQueue.length === 0) {
                // If nothing is playing and the queue is empty, ensure video volume is restored
                if (audioQueue.length === 0) {
                    const videoPlayer = document.getElementById('ad-video');
                    if (videoPlayer) videoPlayer.volume = 1.0;
                }
                return;
            }
            
            isPlaying = true;
            
            // Duck the video volume down to 10%
            const videoPlayer = document.getElementById('ad-video');
            if (videoPlayer) videoPlayer.volume = 0.1;

            const url = audioQueue.shift();
            const audio = new Audio(url);
            
            audio.onended = () => {
                isPlaying = false;
                playNextAudio();
            };
            
            audio.onerror = () => {
                console.error("Failed to play local AI voice");
                isPlaying = false;
                playNextAudio();
            };
            
            audio.play().catch(err => {
                console.error("Playback prevented:", err);
                isPlaying = false;
                playNextAudio();
            });
        }

        // Detect if running on TV laptop (localhost/local dns) or from cloud (remote)
        const IS_LOCAL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === 'toyotaautofocus2026.local';
        const API_BASE = IS_LOCAL ? 'http://toyotaautofocus2026.local' : '';

        // Build the Queue Grid DOM
        const modelCodes = {
            toyota: { 
                1: { name: "RAV4 LTD HEV", prefix: "RH" }, 
                2: { name: "bZ4X", prefix: "BZ" }, 
                3: { name: "Urban Cruiser", prefix: "UC" }, 
                4: { name: "RAV4 ADV", prefix: "RA" }, 
                5: { name: "Yaris Cross SE HEV", prefix: "YC" }, 
                6: { name: "Corolla Cross G HEV", prefix: "CC" }, 
                7: { name: "ATIV HEV", prefix: "AH" } 
            },
            lexus:  { 
                1: { name: "IS Premier", prefix: "IS" }, 
                2: { name: "Lexus NX", prefix: "NX" }, 
                3: { name: "Lexus LBX", prefix: "LBX" },
                4: { name: "Lexus RX", prefix: "RX" }
            }
        };
        const unitCounts = {
            toyota: 7,
            lexus: 4
        };

        brands.forEach(brand => {
            const grid = document.getElementById(`${brand}-grid`);
            const count = unitCounts[brand];
            for (let i = 1; i <= count; i++) {
                const card = document.createElement('div');
                card.className = 'unit-card';
                card.id = `card-${brand}-${i}`;
                
                const modelCode = modelCodes[brand][i];

                card.innerHTML = `
                    <div class="unit-label" style="line-height: 1.2;">${modelCode.name}</div>
                    <div class="unit-number-wrapper">
                        <div class="unit-number" id="num-${brand}-${i}"><span class="prefix">${modelCode.prefix}</span>00</div>
                    </div>
                `;
                grid.appendChild(card);
            }
        });

        // Backend Polling System (Cloudflare)
        async function pollData() {
            let data;
            try {
                const response = await fetch(`${API_BASE}/api/data`);
                if (!response.ok) throw new Error("Primary failed");
                data = await response.json();
            } catch (err) {
                if (!IS_LOCAL) {
                    try {
                        const localResponse = await fetch('http://toyotaautofocus2026.local/api/data');
                        if (localResponse.ok) data = await localResponse.json();
                    } catch(localErr) { return; }
                } else { return; }
            }

            if (!data) return;

            // Prevent "rubber-banding" race condition where slow API pulls downgrade fast local UI clicks
            if (Date.now() - lastLocalUpdate < 3000) return;

            // Check for explicit re-announce triggers
            if (data.reannounce && (!localData.reannounce || localData.reannounce.ts !== data.reannounce.ts)) {
                const ra = data.reannounce;
                // Wait to make sure we don't double fire if the value also changed
                setTimeout(() => {
                    animateChange(ra.brand, ra.unit, data[ra.brand] ? data[ra.brand][ra.unit] : 0, true);
                }, 50);
            }

            brands.forEach(brand => {
                const count = unitCounts[brand];
                for (let i = 1; i <= count; i++) {
                    if (data[brand] && data[brand][i] !== undefined) {
                        if (!localData[brand] || localData[brand][i] !== data[brand][i]) {
                            animateChange(brand, i, data[brand][i]);
                        }
                    }
                }
            });
            localData = data;
        }

        function animateChange(brand, unit, newValue, forceReannounce = false) {
            const el = document.getElementById(`num-${brand}-${unit}`);
            const card = document.getElementById(`card-${brand}-${unit}`);

            const prefix = modelCodes[brand][unit].prefix;
            const formattedVal = String(newValue).padStart(2, '0');
            const displayValue = prefix + formattedVal;

            if (forceReannounce || (el && el.textContent != displayValue)) {
                el.innerHTML = `<span class="prefix">${prefix}</span>${formattedVal}`;
                
                // Voice Announcement (skip if value is zero)
                if (newValue > 0) {
                    announceNumber(displayValue);
                }
                
                el.classList.remove('animate-pop');
                card.classList.remove(`flash-${brand}`);
                void el.offsetWidth;
                void card.offsetWidth;
                el.classList.add('animate-pop');
                card.classList.add(`flash-${brand}`);
            }
        }

        // Ensure polling runs constantly in background
        pollData(); // initial
        setInterval(() => pollData(), 2000);

        // Listen for immediate localStorage updates from dashboard
        window.addEventListener('storage', (event) => {
            if (event.key === 'queueUpdate') {
                const msg = JSON.parse(event.newValue);
                lastLocalUpdate = Date.now(); // Lockout polling for 3 seconds
                animateChange(msg.brand, msg.unit, msg.val, msg.forceReannounce);
                if (!localData[msg.brand]) localData[msg.brand] = {};
                localData[msg.brand][msg.unit] = parseInt(msg.val, 10);
                
                // Prevent polling from double-triggering this exact reannounce
                if (msg.forceReannounce) {
                    localData.reannounce = { brand: msg.brand, unit: msg.unit, ts: msg.ts };
                }
            } else if (event.key === 'queueDataSync') {
                const data = JSON.parse(event.newValue);
                localData = data;
                brands.forEach(brand => {
                    const count = unitCounts[brand];
                    for (let i = 1; i <= count; i++) {
                        const el = document.getElementById(`num-${brand}-${i}`);
                        if (el && data[brand] && data[brand][i] !== undefined) {
                            const prefix = modelCodes[brand][i].prefix;
                            const formattedVal = String(data[brand][i]).padStart(2, '0');
                            el.innerHTML = `<span class="prefix">${prefix}</span>${formattedVal}`;
                        }
                    }
                });
            }
        });


        // --------- AUTOMATED VIDEO AD ENGINE ---------
        let adVideos = [];
        let currentAdIndex = 0;
        let adTimer = null;

        // Auto-fetch local video playlist on boot from your shadow server
        async function fetchLocalVideos() {
            try {
                const response = await fetch('http://toyotaautofocus2026.local/api/videos');
                const videos = await response.json();

                if (videos.length > 0) {
                    adVideos = videos;
                    console.log("Successfully connected to Local Video Engine. Found " + adVideos.length + " ads.");
                    scheduleNextAd(); // Start the 60-90s clock
                } else {
                    console.warn("Local Video API connected, but your 'videos' folder is currently empty!");
                }
            } catch (error) {
                console.error("CRITICAL: Failed to connect to local video server! Make sure your start_video_server.vbs is running in the background.", error);
            }
        }

        // Wait Engine
        function scheduleNextAd() {
            if (adVideos.length === 0) return; // Failsafe

            // Calculate random wait time between 60,000ms (60s) and 90,000ms (90s)
            const minTime = 120000;
            const maxTime = 180000;
            const waitTimeMs = Math.floor(Math.random() * (maxTime - minTime + 1) + minTime);

            console.log(`Next ad scheduled in ${waitTimeMs / 1000} seconds.`);
            adTimer = setTimeout(playNextAd, waitTimeMs);
        }

        // Trigger Ad Overlay
        function playNextAd() {
            if (adVideos.length === 0) return;

            const overlay = document.getElementById('video-overlay');
            const player = document.getElementById('ad-video');

            // Show black overlay masking the queue
            overlay.style.display = 'block';

            // Feed the next video source instantly off localhost
            player.src = adVideos[currentAdIndex];

            // Rotate the tracker so next time it picks the next video
            currentAdIndex = (currentAdIndex + 1) % adVideos.length;

            // Force play
            player.play().catch(e => {
                console.error("Autoplay was blocked by browser. Skipping ad.", e);
                endAd();
            });
        }

        // Extremely Crucial: Wait for the exact conclusion of the video
        document.getElementById('ad-video').onended = function () {
            endAd();
        };

        // Ad Ending Protocol
        function endAd() {
            const overlay = document.getElementById('video-overlay');
            const player = document.getElementById('ad-video');

            // Reset player and hide overlay
            player.src = "";
            overlay.style.display = 'none';

            // The ad is finished, so start the queue waiting timer over again
            scheduleNextAd();
        }

        // --------- FULLSCREEN HELPER ---------
        function goFullscreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); // Safari
        }

        // Industry Standard Autoplay Bypass
        function startDisplay() {
            // Hide the blocker
            document.getElementById('start-overlay').style.display = 'none';
            
            voiceEnabled = true;
            // Play a silent audio to unlock AudioContext on browsers
            const unlockAudio = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
            unlockAudio.play().catch(() => {});

            // Go fullscreen automatically
            goFullscreen();
            
            // NOW we start the video engine, because we have a trusted user gesture!
            fetchLocalVideos();
        }

        // Auto-hide the button once fullscreen is active, show it again if user exits
        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fs-prompt');
            if (document.fullscreenElement) {
                btn.style.opacity = '0';
                btn.style.pointerEvents = 'none';
            } else {
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }
        });
    </script>
</body>

</html>
