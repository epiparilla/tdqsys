<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Drive Queue - Mobile Status</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { overflow-y: auto; height: auto; }
        .split-container { flex-direction: column; height: auto; }
        .stacked-container { height: auto; }
        .stacked-container .brand-section { min-height: 30vh; border-right: none; }
        .queue-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .unit-card { padding: 1rem 0.5rem; }
        .unit-number { font-size: 4rem; }
        @media (min-width: 600px) {
            .queue-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div style="display:none;" id="site-picker">
        <div style="text-align:center; padding:12px; background:#111; color:#eee; font-size:0.85rem;">
            <label for="site-input" style="opacity:0.7; margin-right:0.4rem;">Instance / mirror link</label>
            <input type="text" id="site-input" placeholder="paste ?id=... or instance id" style="background:#1a1a2e; color:#fff; border:1px solid rgba(255,255,255,0.3); border-radius:6px; padding:5px 10px; width:260px;">
            <button onclick="selectSite()" style="margin-left:0.4rem; padding:5px 14px; border-radius:6px; border:none; background:#EB0A1E; color:#fff; cursor:pointer;">Watch</button>
        </div>
    </div>

    <div class="stacked-container" id="brand-sections">
        <!-- Brand sections rendered from config via af.js -->
    </div>

    <div style="text-align: center; padding: 10px; background: #111; color: #666; font-size: 0.8rem;" id="footer-note">
        Status syncs automatically every 30 seconds
    </div>

    <script src="af.js"></script>
    <script>
        let dataStore = null;
        let modelLookup = {};

        function selectSite() {
            let v = document.getElementById('site-input').value.trim();
            // Accept a full mirror link (https://...client.html?id=uuid) or a bare id.
            if (v.includes('=')) {
                try { v = new URL(v).searchParams.get('id') || ''; } catch (e) { v = ''; }
            }
            v = String(v).toLowerCase();
            if (!/^[0-9a-fA-F-]{1,64}$/.test(v)) { alert('That is not a valid TDQSYS instance link.'); return; }
            try { localStorage.setItem('af_instance_id', v); } catch (e) {}
            document.getElementById('site-input').value = v;
            dataStore = null;
            pollData(true);
        }

        function initSitePicker() {
            // Only the cloud mirror (multi-location viewer) needs the picker.
            if (afIsLocal()) return;
            const bar = document.getElementById('site-picker');
            bar.style.display = 'block';
            document.getElementById('site-input').value = afInstanceId() || '';
            if (!afInstanceId()) {
                document.getElementById('footer-note').textContent =
                    'Open a location\u2019s mirror link from TDQSYS \u2192 Settings \u2192 System Identity, or paste an instance id above.';
            }
        }

        function buildDisplay(state) {
            const container = document.getElementById('brand-sections');
            container.innerHTML = '';
            modelLookup = {};
            const config = state.config || {};

            config.brands.forEach(brand => {
                const section = document.createElement('main');
                section.className = 'brand-section';
                section.dataset.brandKey = brand.key;
                section.style.setProperty('--brand-accent', brand.color);

                const header = document.createElement('header');
                header.className = 'brand-header';
                const h1 = document.createElement('h1');
                h1.textContent = brand.name;
                header.appendChild(h1);
                const p = document.createElement('p');
                p.textContent = 'Test Drive Queue';
                header.appendChild(p);
                section.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'queue-grid';
                grid.id = `grid-${brand.key}`;
                section.appendChild(grid);
                container.appendChild(section);

                modelLookup[brand.key] = brand.models;
                brand.models.forEach((model, idx) => {
                    const i = idx + 1;
                    const card = document.createElement('div');
                    card.className = 'unit-card';
                    card.id = `card-${brand.key}-${i}`;
                    card.innerHTML = `
                        <div class="unit-label">${model.label}</div>
                        <div class="unit-number-wrapper">
                            <div class="unit-number" id="num-${brand.key}-${i}">0</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        function renderAll(state) {
            (state.config.brands || []).forEach(brand => {
                brand.models.forEach((model, idx) => {
                    const i = idx + 1;
                    const el = document.getElementById(`num-${brand.key}-${i}`);
                    if (el) {
                        const v = (state.queues[brand.key] && state.queues[brand.key][i]) || 0;
                        el.innerText = v;
                    }
                });
            });
        }

        function animateChange(brandKey, unit, newValue) {
            const el = document.getElementById(`num-${brandKey}-${unit}`);
            const card = document.getElementById(`card-${brandKey}-${unit}`);
            if (el && el.innerText != newValue) {
                el.innerText = newValue;
                el.classList.remove('animate-pop');
                card.classList.remove('flash-brand');
                void el.offsetWidth;
                void card.offsetWidth;
                el.classList.add('animate-pop');
                card.classList.add('flash-brand');
            }
        }

        async function pollData(isInitial = false) {
            const data = await afFetchState();
            if (!data) return;
            if (isInitial) {
                if (!dataStore) buildDisplay(data);
                dataStore = data;
                renderAll(data);
            } else {
                data.config.brands.forEach(brand => {
                    brand.models.forEach((model, idx) => {
                        const i = idx + 1;
                        const v = (data.queues[brand.key] && data.queues[brand.key][i]) || 0;
                        const old = (dataStore.queues[brand.key] && dataStore.queues[brand.key][i]) || 0;
                        if (old !== v) animateChange(brand.key, i, v);
                    });
                });
                dataStore = data;
            }
        }

        window.addEventListener('storage', (event) => {
            if (event.key === 'queueUpdate') {
                const msg = JSON.parse(event.newValue);
                animateChange(msg.brand, msg.unit, parseInt(msg.val, 10));
                if (!dataStore.queues[msg.brand]) dataStore.queues[msg.brand] = {};
                dataStore.queues[msg.brand][msg.unit] = parseInt(msg.val, 10);
            }
        });

        initSitePicker();
        pollData(true);
        setInterval(() => pollData(false), 30000);
    </script>
</body>
</html>
