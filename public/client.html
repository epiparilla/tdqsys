<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDQSYS Queue Viewer</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Pull-to-refresh indicator. Lives only on this page; the TV board
           (display_with_ads.html) has no markup for it and is unaffected. */
        html,
        body {
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #ptr {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: rgba(10, 10, 10, 0.92);
            border-bottom: 1px solid var(--brand-accent, #EB0A1E);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transform: translateY(-56px);
            transition: transform 0.22s ease;
            z-index: 9000;
            pointer-events: none;
        }

        #ptr-arrow {
            font-size: 1.1rem;
            line-height: 1;
            color: var(--brand-accent, #EB0A1E);
        }
    </style>
</head>

<body style="overflow: hidden;">

    <!-- PULL TO REFRESH INDICATOR -->
    <div id="ptr">
        <div id="ptr-arrow">↓</div>
        <div id="ptr-label">Pull to refresh</div>
    </div>

    <!-- FULL SCREEN AD OVERLAY -->
    <div id="video-overlay"
        style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0, 0, 0, 1); z-index:9999; opacity:1; transition: opacity 0.5s ease;">
        <video id="ad-video" style="width:100%; height:100%; object-fit:contain; background:transparent;"></video>
    </div>

    <div class="stacked-container" id="brand-sections">
        <!-- Brand sections rendered from config via af.js -->
    </div>

    <script src="af.js"></script>
    <script>
        // --------- CONFIG DRIVEN STATE ---------
        let dataStore = null;
        let lastLocalUpdate = 0;
        let modelLookup = {}; // brandKey -> [{label, prefix, pronounce}, ...]
        let lastConfigSignature = ''; // layout fingerprint; drives grid rebuilds
        let noLocationShown = false; // cloud viewer with no ?id=; panel is sticky

        // --------- VOICE SYSTEM LOGIC (unchanged behavior) ---------
        let voiceEnabled = false;
        const audioQueue = [];
        let isPlaying = false;

        function announceNumber(displayValue) {
            if (!voiceEnabled) return;
            const ttsPort = (dataStore && dataStore.config && dataStore.config.ttsPort) || 8001;
            const url = `http://localhost:${ttsPort}/api/speak_unit?voice=af_heart&unit=${encodeURIComponent(displayValue)}`;
            audioQueue.push(url);
            playNextAudio();
        }

        function playNextAudio() {
            if (isPlaying || audioQueue.length === 0) {
                if (audioQueue.length === 0) {
                    const videoPlayer = document.getElementById('ad-video');
                    if (videoPlayer) videoPlayer.volume = 1.0;
                }
                return;
            }

            isPlaying = true;
            const videoPlayer = document.getElementById('ad-video');
            if (videoPlayer) videoPlayer.volume = 0.1;

            const url = audioQueue.shift();
            const audio = new Audio(url);
            audio.onended = () => { isPlaying = false; playNextAudio(); };
            audio.onerror = () => { console.error("Failed to play local AI voice"); isPlaying = false; playNextAudio(); };
            audio.play().catch(err => { console.error("Playback prevented:", err); isPlaying = false; playNextAudio(); });
        }

        // --------- BUILD DOM FROM CONFIG ---------
        function buildDisplay(state) {
            const container = document.getElementById('brand-sections');
            container.innerHTML = '';
            modelLookup = {};
            const config = state.config || {};

            config.brands.forEach(brand => {
                const section = document.createElement('main');
                section.className = 'brand-section';
                section.dataset.brandKey = brand.key;
                section.style.setProperty('--brand-accent', brand.color);
                section.style.setProperty('--flex-grow', Math.max(1, Math.ceil(brand.models.length / 4)));
                // Phone layout hints: two cards per row in portrait, three in
                // landscape. --rows is the real row count so every card fits on
                // screen; --rows-scale shrinks the type once rows pass 6 so a
                // crowded brand stays readable instead of scrolling.
                const modelCount = (brand.models || []).length;
                section.style.setProperty('--rows', Math.max(1, Math.ceil(modelCount / 2)));
                section.style.setProperty('--rows-landscape', Math.max(1, Math.ceil(modelCount / 3)));
                section.style.setProperty('--rows-scale', Math.min(1, 6 / Math.max(2, Math.ceil(modelCount / 2))));

                const header = document.createElement('header');
                header.className = 'brand-header';
                const h1 = document.createElement('h1');
                h1.textContent = brand.name;
                header.appendChild(h1);
                section.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'queue-grid';
                grid.id = `grid-${brand.key}`;
                section.appendChild(grid);
                container.appendChild(section);

                modelLookup[brand.key] = brand.models;
                brand.models.forEach((model, idx) => {
                    const i = idx + 1;
                    const card = document.createElement('div');
                    card.className = 'unit-card';
                    card.id = `card-${brand.key}-${i}`;
                    card.innerHTML = `
                        <div class="unit-label" style="line-height: 1.2;">${model.label}</div>
                        <div class="unit-number-wrapper">
                            <div class="unit-number" id="num-${brand.key}-${i}"><span class="prefix">${model.prefix}</span>00</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        function renderAll(state) {
            (state.config.brands || []).forEach(brand => {
                brand.models.forEach((model, idx) => {
                    const i = idx + 1;
                    const el = document.getElementById(`num-${brand.key}-${i}`);
                    if (!el) return;
                    const v = (state.queues[brand.key] && state.queues[brand.key][i]) || 0;
                    const formattedVal = String(v).padStart(2, '0');
                    const displayValue = model.prefix + formattedVal;
                    if (el.textContent != displayValue) {
                        el.innerHTML = `<span class="prefix">${model.prefix}</span>${formattedVal}`;
                    }
                });
            });
        }

        // --------- BACKEND POLLING ---------
        // Fingerprint of everything that decides WHICH cards exist. Enabling a
        // brand or adding/removing cars changes config without changing any
        // queue number, so polling alone cannot notice it -- the grid has to be
        // rebuilt when this changes.
        function configSignature(config) {
            return (config.brands || []).map(b =>
                [b.key, b.name, b.color, (b.models || []).map(m => [m.label, m.prefix, m.pronounce].join('~')).join('~')].join('^')
            ).join('|');
        }

        async function pollData() {
            let data = await afFetchState();
            if (!data) {
                // No state because the cloud viewer has no location in its URL.
                // Say so plainly instead of rendering an empty or wrong board.
                // Render once: this runs every 2s and re-rendering would wipe
                // whatever the user has typed into the field.
                if (!dataStore && !noLocationShown && !afIsLocal() && !afHasCloudTarget()) {
                    noLocationShown = true;
                    afRenderNoLocation(document.getElementById('brand-sections'), {
                        origin: new URLSearchParams(window.location.search).get('id')
                    });
                }
                return;
            }
            if (Date.now() - lastLocalUpdate < 3000) return;

            const signature = configSignature(data.config || {});

            // First paint, or Settings changed the layout: rebuild the grid.
            if (!dataStore || signature !== lastConfigSignature) {
                lastConfigSignature = signature;
                buildDisplay(data);
                dataStore = data;
                renderAll(data);
                return;
            }

            // Check for explicit re-announce triggers
            if (data.reannounce && (!dataStore.reannounce || dataStore.reannounce.ts !== data.reannounce.ts)) {
                const ra = data.reannounce;
                setTimeout(() => {
                    const prefix = (modelLookup[ra.brand] && modelLookup[ra.brand][ra.unit-1] && modelLookup[ra.brand][ra.unit-1].prefix) || '';
                    animateChange(ra.brand, ra.unit, (data.queues[ra.brand] && data.queues[ra.brand][ra.unit]) || 0, prefix, true);
                }, 50);
            }

            data.config.brands.forEach(brand => {
                brand.models.forEach((model, idx) => {
                    const i = idx + 1;
                    if (data.queues[brand.key] && data.queues[brand.key][i] !== undefined) {
                        const old = (dataStore.queues[brand.key] && dataStore.queues[brand.key][i]) || 0;
                        if (old !== data.queues[brand.key][i]) {
                            animateChange(brand.key, i, data.queues[brand.key][i], model.prefix);
                        }
                    }
                });
            });
            dataStore = data;
        }

        function animateChange(brandKey, unit, newValue, prefix, forceReannounce = false) {
            const el = document.getElementById(`num-${brandKey}-${unit}`);
            const card = document.getElementById(`card-${brandKey}-${unit}`);
            if (!el) return;

            const formattedVal = String(newValue).padStart(2, '0');
            const displayValue = prefix + formattedVal;

            if (forceReannounce || (el.textContent != displayValue)) {
                el.innerHTML = `<span class="prefix">${prefix}</span>${formattedVal}`;
                if (newValue > 0) {
                    announceNumber(displayValue);
                }
                el.classList.remove('animate-pop');
                card.classList.remove('flash-brand');
                void el.offsetWidth;
                void card.offsetWidth;
                el.classList.add('animate-pop');
                card.classList.add('flash-brand');
            }
        }

        pollData();
        setInterval(() => pollData(), 2000);

        // Listen for immediate localStorage updates from dashboard
        window.addEventListener('storage', (event) => {
            if (event.key === 'queueUpdate') {
                const msg = JSON.parse(event.newValue);
                lastLocalUpdate = Date.now();
                const prefix = (modelLookup[msg.brand] && modelLookup[msg.brand][msg.unit-1] && modelLookup[msg.brand][msg.unit-1].prefix) || '';
                animateChange(msg.brand, msg.unit, msg.val, prefix, msg.forceReannounce);
                if (!dataStore.queues[msg.brand]) dataStore.queues[msg.brand] = {};
                dataStore.queues[msg.brand][msg.unit] = parseInt(msg.val, 10);
                if (msg.forceReannounce) {
                    dataStore.reannounce = { brand: msg.brand, unit: msg.unit, ts: msg.ts };
                }
            } else if (event.key === 'queueDataSync') {
                const data = JSON.parse(event.newValue);
                if (data && data.config) {
                    lastConfigSignature = configSignature(data.config);
                    buildDisplay(data);
                    dataStore = data;
                    renderAll(data);
                }
            }
        });

        // --------- AUTOMATED VIDEO AD ENGINE ---------
        // State machine: GAP (queue numbers, random wait) -> LOADING (assign src)
        // -> PLAYING (play) -> GAP -> ... forever.
        // Single-flight token prevents overlapping load()/play() promises from
        // aborting each other (the "Autoplay blocked / interrupted by a new
        // load or pause" cascades that used to leave the element paused forever).
        let adVideos = [];
        let currentAdIndex = 0;
        let adTimer = null;
        let adConfig = { minSec: 120, maxSec: 180, enabled: true };
        let adState = 'GAP';
        let adToken = 0;
        let adCanplayTO = null;
        let adGapTimer = null;
        let adStallIv = null;
        let adLastCt = -1;
        let adStaleTicks = 0;
        let adHideTO = null;

        async function fetchLocalVideos() {
            try {
                const response = await fetch(`${afApiBase()}/api/videos`);
                const videos = await response.json();
                if (videos.length > 0) {
                    adVideos = videos;
                    console.log("Connected to Local Video Engine. Found " + adVideos.length + " ads.");
                    scheduleNextAd();
                } else {
                    console.warn("Local Video API connected, but 'videos' folder is empty!");
                }
            } catch (error) {
                console.error("Failed to connect to local video server.", error);
            }
        }

        function clearAdTimers() {
            if (adCanplayTO) { clearTimeout(adCanplayTO); adCanplayTO = null; }
            if (adGapTimer) { clearTimeout(adGapTimer); adGapTimer = null; }
        }

        function stopAdWatchdog() {
            if (adStallIv) { clearInterval(adStallIv); adStallIv = null; }
            adLastCt = -1;
            adStaleTicks = 0;
        }

        function startAdWatchdog() {
            stopAdWatchdog();
            adStallIv = setInterval(() => {
                if (adState !== 'PLAYING') { adStaleTicks = 0; return; }
                const v = document.getElementById('ad-video');
                if (v.ended) return;
                if (v.paused) adStaleTicks++;
                else if (v.readyState >= 2) {
                    const ct = v.currentTime;
                    adStaleTicks = (Math.abs(ct - adLastCt) < 0.05) ? adStaleTicks + 1 : 0;
                    adLastCt = ct;
                }
                if (adStaleTicks >= 3) {
                    console.warn("Stall watchdog: playback frozen ~" + (adStaleTicks * 2) + "s. Advancing.");
                    endAd();
                }
            }, 2000);
        }

        function scheduleNextAd() {
            if (adVideos.length === 0) return;
            clearAdTimers();
            adState = 'GAP';
            adToken++;
            // Both gaps are SECONDS: keep min<=max in seconds, then convert to ms.
            const minSec = Math.max(1, adConfig.minSec || 1);
            const maxSec = Math.max(minSec, adConfig.maxSec || minSec);
            const waitTimeMs = Math.floor(Math.random() * ((maxSec - minSec + 1) * 1000) + minSec * 1000);
            console.log(`Next ad scheduled in ${waitTimeMs / 1000} seconds.`);
            const token = adToken;
            adGapTimer = setTimeout(() => { if (token === adToken) playNextAd(); }, waitTimeMs);
        }

        function playNextAd() {
            if (adVideos.length === 0) return;
            clearAdTimers();
            const token = ++adToken;
            adState = 'LOADING';
            const overlay = document.getElementById('video-overlay');
            const player = document.getElementById('ad-video');
            if (adHideTO) { clearTimeout(adHideTO); adHideTO = null; }
            overlay.style.display = 'block';
            void overlay.offsetWidth;
            overlay.style.opacity = '1';
            const url = adVideos[currentAdIndex];
            currentAdIndex = (currentAdIndex + 1) % adVideos.length;
            try { player.pause(); } catch (e) { }
            player.removeAttribute('src');
            player.src = url;
            console.log("Playing ad: " + url.split('/').pop());

            const onCanplay = () => {
                if (token !== adToken) return; // superseded by a newer ad
                clearAdTimers();
                adState = 'PLAYING';
                adLastCt = -1;
                adStaleTicks = 0;
                startAdWatchdog();
                const p = player.play();
                if (p && typeof p.then === 'function') p.catch((e) => {
                    if (token !== adToken) return; // superseded
                    if (e && e.name === 'AbortError') {
                        // A newer load()/pause() superseded this play attempt.
                        // Benign: advance to the next gap instead of erroring out.
                        console.warn("play() superseded (AbortError) - benign, moving on.");
                    } else {
                        console.error("play() rejected: " + (e && e.message));
                    }
                    endAd();
                });
            };
            player.addEventListener('canplay', onCanplay, { once: true });

            adCanplayTO = setTimeout(() => {
                if (token !== adToken) return;
                console.warn("canplay timeout for " + url.split('/').pop() + ". Skipping ad.");
                player.removeEventListener('canplay', onCanplay);
                endAd();
            }, 8000);
        }

        // A file that fails to load/decode must never kill the rotation:
        // skip it and schedule the next ad. Stray errors in GAP (empty src)
        // are ignored.
        document.getElementById('ad-video').onerror = function () {
            if (adState === 'GAP') return;
            console.error("Ad video failed to load/decode. Skipping.");
            endAd();
        };

        document.getElementById('ad-video').onended = function () {
            if (adState === 'GAP') return;
            console.log("Ad ended -> gap.");
            endAd();
        };

        function endAd() {
            const overlay = document.getElementById('video-overlay');
            const player = document.getElementById('ad-video');
            stopAdWatchdog();
            clearAdTimers();
            const token = ++adToken;
            adState = 'GAP';
            try { player.pause(); } catch (e) { }
            player.removeAttribute('src');
            overlay.style.opacity = '0';
            if (adHideTO) clearTimeout(adHideTO);
            adHideTO = setTimeout(() => { if (token === adToken) overlay.style.display = 'none'; }, 500);
            scheduleNextAd();
        }

        // --------- VIEWER STARTUP ---------
        // No tap-to-start gate and no fullscreen here: this page is the remote
        // queue viewer, so it renders the moment data arrives. Voice and video
        // ads both target localhost (the location's own PC), so they are only
        // wired up when this page is opened there -- on a phone they would
        // just error, and the ad overlay has nothing to unlock.
        function startViewer() {
            const onLocalBox = afIsLocal();
            voiceEnabled = onLocalBox;
            if (onLocalBox) fetchLocalVideos();
        }

        startViewer();

        // -------------------------------------
        // PULL TO REFRESH
        // This board is fixed-size and never scrolls, so a downward drag from
        // anywhere reloads it. The indicator tracks the finger with a
        // rubber-band curve, arms past PTR_TRIGGER, and snaps back otherwise.
        // -------------------------------------
        const PTR_H = 56;      // indicator height, matches the CSS
        const PTR_MAX = 110;   // furthest the finger drag can pull it
        const PTR_TRIGGER = 64; // pull distance that arms the reload
        const ptr = document.getElementById('ptr');
        const ptrArrow = document.getElementById('ptr-arrow');
        const ptrLabel = document.getElementById('ptr-label');
        let ptrStartY = 0;
        let ptrPull = 0;
        let ptrActive = false;

        function ptrRender() {
            ptr.style.transform = `translateY(${ptrPull - PTR_H}px)`;
            const armed = ptrPull >= PTR_TRIGGER;
            ptrArrow.style.transform = armed ? 'rotate(180deg)' : 'rotate(0deg)';
            ptrArrow.style.opacity = String(Math.min(1, 0.4 + (ptrPull / PTR_TRIGGER) * 0.6));
            ptrLabel.textContent = armed ? 'Release to refresh' : 'Pull to refresh';
        }

        document.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return;
            ptrStartY = e.touches[0].clientY;
            ptrActive = window.scrollY <= 0;
            ptrPull = 0;
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            // Pinch-zoom (2 fingers) is left alone; only a single downward
            // drag is claimed, so the gesture never blocks the page.
            if (!ptrActive || e.touches.length !== 1) return;
            const dy = e.touches[0].clientY - ptrStartY;
            if (dy <= 0) {
                if (ptrPull !== 0) { ptrPull = 0; ptrRender(); }
                return;
            }
            ptrPull = Math.min(PTR_MAX, dy * 0.5); // rubber-band
            if (e.cancelable) e.preventDefault();
            ptrRender();
        }, { passive: false });

        document.addEventListener('touchend', () => {
            if (!ptrActive) return;
            ptrActive = false;
            if (ptrPull >= PTR_TRIGGER) {
                ptrLabel.textContent = 'Refreshing';
                ptr.style.transition = 'transform 0.15s ease';
                ptr.style.transform = `translateY(${PTR_TRIGGER - PTR_H}px)`;
                setTimeout(() => location.reload(), 200);
            } else {
                ptrPull = 0;
                ptrRender();
            }
        });

        // Load ad interval from config when display is built
        const origPoll = pollData;
        pollData = async function () {
            await origPoll();
            if (dataStore && dataStore.config && dataStore.config.ads) {
                adConfig = dataStore.config.ads;
            }
        };
    </script>
</body>

</html>
