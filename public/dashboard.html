<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDQSYS Facilitator Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard">

    <header class="dashboard-header">
        <h1>TDQSYS Facilitator Dashboard</h1>
        <div class="header-links">
            <a href="display_with_ads.html" target="_blank" class="link-button">Open Display Screen (New Window)</a>
            <a href="settings.html" class="link-button" id="settings-link">System Settings</a>
        </div>
        <p id="licence-locked" style="display:none; margin-top:0.8rem; padding:0.7rem 1rem; border:1px solid #fbbf24; border-radius:10px; color:#fcd34d; font-size:0.9rem;">
            <strong>Controls disabled.</strong> <span id="licence-locked-why"></span>
            Cars are still being served and the queue below still shows live values — they just cannot be changed.
        </p>
        <p id="save-rejected" style="display:none; margin-top:0.8rem; padding:0.7rem 1rem; border:1px solid #f87171; border-radius:10px; color:#fca5a5; font-size:0.9rem;">
            <strong>Not saving.</strong> <span id="save-rejected-why"></span>
        </p>
    </header>

    <main class="controls-wrapper" id="brand-sections">
        <!-- Brand sections rendered from config via af.js -->
    </main>

    <script src="af.js"></script>
    <script>
        let dataStore = null; // { config, queues, reannounce }
        let saveTimeout = null;
        let modelLookup = {}; // brandKey -> [{label, prefix, pronounce}, ...]
        let licenceCanWrite = true; // until proven otherwise
        let licenceStatus = null; // last successful /api/license answer

        // Settings is local-machine only in the packaged app; hide the link on phones.
        if (!afIsLocal()) {
            document.getElementById('settings-link').style.display = 'none';
        }

        // ---------------------------------------------------------------
        // Licence lock
        // ---------------------------------------------------------------
        // An expired licence must not feel live. Previously the controls stayed
        // tappable: the number changed on screen, the save was refused, and it
        // silently snapped back a moment later. An operator reasonably read
        // that as a software fault. Better to refuse the tap outright and say
        // why, while the board keeps showing live values.
        async function fetchLicence() {
            try {
                const r = await fetch(`${afApiBase()}/api/license`);
                if (!r.ok) return null;
                return await r.json();
            } catch (e) {
                return null;   // engine restarting; leave controls as they are
            }
        }

        function applyLicenceLock(st) {
            if (!st) return;
            licenceCanWrite = !!st.canWrite;

            // The queue controls only. The two header links stay live on
            // purpose: an operator whose licence lapsed still needs the display
            // screen and, more importantly, Settings to renew.
            document.querySelectorAll('#brand-sections button, #brand-sections input')
                .forEach((el) => {
                    el.disabled = !licenceCanWrite;
                    el.style.opacity = licenceCanWrite ? '' : '0.35';
                    el.style.cursor = licenceCanWrite ? '' : 'not-allowed';
                });

            const banner = document.getElementById('licence-locked');
            const why = document.getElementById('licence-locked-why');
            if (!banner || !why) return;

            if (licenceCanWrite) {
                banner.style.display = 'none';
            } else {
                why.textContent = st.state === 'expired'
                    ? 'This licence expired on ' + (st.until || 'an unknown date') + '.'
                    : 'This location is not licensed.';
                banner.style.display = 'block';
            }
        }

        async function refreshLicence() {
            const st = await fetchLicence();
            if (st) {
                licenceStatus = st;
                applyLicenceLock(st);
            }
        }

        function refuseIfLocked() {
            if (licenceCanWrite) return false;
            const banner = document.getElementById('licence-locked');
            if (banner) banner.style.display = 'block';
            return true;
        }

        function buildDashboard(state) {
            const container = document.getElementById('brand-sections');
            container.innerHTML = '';
            modelLookup = {};
            const config = state.config || {};

            config.brands.forEach(brand => {
                const section = document.createElement('section');
                section.className = 'controls-brand-section';
                section.dataset.brandKey = brand.key;
                section.style.setProperty('--brand-accent', brand.color);

                const h2 = document.createElement('h2');
                h2.textContent = brand.name + ' CONTROLS';
                h2.style.cssText = 'margin-bottom:1rem; text-align:center; color:white;';
                section.appendChild(h2);

                const grid = document.createElement('div');
                grid.className = 'controls-grid';
                grid.id = `controls-${brand.key}`;
                section.appendChild(grid);
                container.appendChild(section);

                modelLookup[brand.key] = brand.models;
                brand.models.forEach((model, idx) => {
                    const i = idx + 1;
                    const val = (state.queues[brand.key] && state.queues[brand.key][i]) || 0;
                    const card = document.createElement('div');
                    card.className = 'control-card';
                    card.innerHTML = `
                        <button onclick="reannounce('${brand.key}', ${i})" style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 1.2rem; cursor: pointer; opacity: 0.5; transition: opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.5" title="Re-announce this number">📣</button>
                        <h3>${model.label} <br><span style="font-size: 0.8rem; opacity: 0.7;">${model.prefix}</span></h3>
                        <div class="input-group">
                            <button class="btn" onclick="updateQueue('${brand.key}', ${i}, -1)">-</button>
                            <input type="number" class="number-input" id="input-${brand.key}-${i}" value="${val}" onchange="setQueue('${brand.key}', ${i}, this.value)">
                            <button class="btn" onclick="updateQueue('${brand.key}', ${i}, 1)">+</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        async function fetchInitialData() {
            const data = await afFetchState();
            if (data) {
                dataStore = data;
                buildDashboard(dataStore);
                try { localStorage.setItem('queueDataSync', JSON.stringify(dataStore)); } catch (e) {}
                // buildDashboard() recreates every control, so the lock has to be
                // re-applied after each rebuild or the first render would be
                // tappable until the next poll.
                if (licenceStatus) applyLicenceLock(licenceStatus);
            }
        }

        function updateQueue(brandKey, unit, delta) {
            if (refuseIfLocked()) return;
            const input = document.getElementById(`input-${brandKey}-${unit}`);
            let current = parseInt(input.value, 10);
            if (isNaN(current)) current = 0;
            let newVal = current + delta;
            if (newVal < 0) newVal = 0;
            if (newVal > 999) newVal = 999;
            input.value = newVal;
            commitChange(brandKey, unit, newVal);
        }

        function setQueue(brandKey, unit, value) {
            if (refuseIfLocked()) return;
            let newVal = parseInt(value, 10);
            if (isNaN(newVal) || newVal < 0) newVal = 0;
            if (newVal > 999) newVal = 999;
            document.getElementById(`input-${brandKey}-${unit}`).value = newVal;
            commitChange(brandKey, unit, newVal);
        }

        function reannounce(brandKey, unit) {
            if (refuseIfLocked()) return;
            const val = document.getElementById(`input-${brandKey}-${unit}`).value;
            const ts = Date.now();
            try {
                localStorage.setItem('queueUpdate', JSON.stringify({ brand: brandKey, unit, val, forceReannounce: true, ts: ts }));
            } catch (e) {}
            dataStore.reannounce = { brand: brandKey, unit, ts: ts };
            backgroundSave();
        }

        function commitChange(brandKey, unit, val) {
            // The single point every queue change funnels through, so the lock
            // is enforced here as well as at each handler.
            if (refuseIfLocked()) return;
            if (!dataStore.queues[brandKey]) dataStore.queues[brandKey] = {};
            dataStore.queues[brandKey][unit] = val;

            try {
                localStorage.setItem('queueUpdate', JSON.stringify({ brand: brandKey, unit, val, ts: Date.now() }));
            } catch (e) {}
            backgroundSave();
        }

        function backgroundSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                const ok = await afSaveState(dataStore);
                const banner = document.getElementById('save-rejected');
                if (!banner) return;
                // Hide it again once a save is accepted, so a transient failure
                // does not leave a permanent "broken" warning.
                banner.style.display = ok ? 'none' : 'block';
            }, 500);
        }

        // The engine can refuse a write (full disk, or a licence refusal once
        // licensing lands). Show it instead of letting the operator believe the
        // number they just ticked over was stored.
        if (typeof afOnSaveRejected === 'function') {
            afOnSaveRejected((detail) => {
                const banner = document.getElementById('save-rejected');
                const why = document.getElementById('save-rejected-why');
                if (banner && why) {
                    why.textContent = 'The queue engine rejected this change (' + detail +
                        '). Numbers shown here are not being saved.';
                    banner.style.display = 'block';
                }
            });
        }

        // INIT
        // Licence first: a board that renders tappable controls before we know
        // the licence state gives the operator a fraction of a second in which
        // a tap looks like it worked.
        refreshLicence().then(() => fetchInitialData());
        // A licence can lapse mid-shift, so re-check rather than trusting boot.
        setInterval(refreshLicence, 60000);
    </script>
</body>

</html>
