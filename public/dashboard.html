<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tdqsys Test Drive - Facilitator Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard">

    <header class="dashboard-header">
        <h1>tdqsys Test Drive Facilitator Dashboard</h1>
        <div class="header-links">
            <a href="display_with_ads.html" target="_blank" class="link-button">Open Display Screen (New Window)</a>
            <a href="settings.html" class="link-button" id="settings-link">System Settings</a>
        </div>
    </header>

    <main class="controls-wrapper" id="brand-sections">
        <!-- Brand sections rendered from config via af.js -->
    </main>

    <!-- RESET ALL BUTTON -->
    <button id="reset-all-btn" onclick="startResetConfirmation()">
        Reset All to Zero
    </button>

    <!-- 2-LEVEL CONFIRMATION MODAL -->
    <div id="reset-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.7); z-index:99999; justify-content:center; align-items:center;">
        <div style="background:#1a1a2e; color:white; padding:2rem 2.5rem; border-radius:12px; text-align:center; font-family:Inter,sans-serif; max-width:400px;">
            <h2 id="reset-modal-title" style="margin:0 0 0.5rem 0;">Are you sure?</h2>
            <p id="reset-modal-message" style="opacity:0.7; margin:0 0 1.5rem 0;">This will reset all queue values to zero.</p>
            <div style="display:flex; gap:1rem; justify-content:center;">
                <button onclick="cancelResetConfirmation()" style="padding:8px 20px; border-radius:6px; border:1px solid rgba(255,255,255,0.3); background:transparent; color:white; cursor:pointer; font-size:0.9rem;">Cancel</button>
                <button id="reset-modal-confirm-btn" onclick="confirmResetStep()" style="padding:8px 20px; border-radius:6px; border:none; background:#dc2626; color:white; cursor:pointer; font-size:0.9rem;">Confirm</button>
            </div>
        </div>
    </div>

    <script src="af.js"></script>
    <script>
        let dataStore = null; // { config, queues, reannounce }
        let saveTimeout = null;
        let modelLookup = {}; // brandKey -> [{label, prefix, pronounce}, ...]

        // Settings is local-machine only in the packaged app; hide the link on phones.
        if (!afIsLocal()) {
            document.getElementById('settings-link').style.display = 'none';
        }

        function buildDashboard(state) {
            const container = document.getElementById('brand-sections');
            container.innerHTML = '';
            modelLookup = {};
            const config = state.config || {};

            config.brands.forEach(brand => {
                const section = document.createElement('section');
                section.className = 'controls-brand-section';
                section.dataset.brandKey = brand.key;
                section.style.setProperty('--brand-accent', brand.color);

                const h2 = document.createElement('h2');
                h2.textContent = brand.name + ' CONTROLS';
                h2.style.cssText = 'margin-bottom:1rem; text-align:center; color:white;';
                section.appendChild(h2);

                const grid = document.createElement('div');
                grid.className = 'controls-grid';
                grid.id = `controls-${brand.key}`;
                section.appendChild(grid);
                container.appendChild(section);

                modelLookup[brand.key] = brand.models;
                brand.models.forEach((model, idx) => {
                    const i = idx + 1;
                    const val = (state.queues[brand.key] && state.queues[brand.key][i]) || 0;
                    const card = document.createElement('div');
                    card.className = 'control-card';
                    card.innerHTML = `
                        <button onclick="reannounce('${brand.key}', ${i})" style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 1.2rem; cursor: pointer; opacity: 0.5; transition: opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.5" title="Re-announce this number">📣</button>
                        <h3>${model.label} <br><span style="font-size: 0.8rem; opacity: 0.7;">${model.prefix}</span></h3>
                        <div class="input-group">
                            <button class="btn" onclick="updateQueue('${brand.key}', ${i}, -1)">-</button>
                            <input type="number" class="number-input" id="input-${brand.key}-${i}" value="${val}" onchange="setQueue('${brand.key}', ${i}, this.value)">
                            <button class="btn" onclick="updateQueue('${brand.key}', ${i}, 1)">+</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        async function fetchInitialData() {
            const data = await afFetchState();
            if (data) {
                dataStore = data;
                buildDashboard(dataStore);
                try { localStorage.setItem('queueDataSync', JSON.stringify(dataStore)); } catch (e) {}
            }
        }

        function updateQueue(brandKey, unit, delta) {
            const input = document.getElementById(`input-${brandKey}-${unit}`);
            let current = parseInt(input.value, 10);
            if (isNaN(current)) current = 0;
            let newVal = current + delta;
            if (newVal < 0) newVal = 0;
            if (newVal > 999) newVal = 999;
            input.value = newVal;
            commitChange(brandKey, unit, newVal);
        }

        function setQueue(brandKey, unit, value) {
            let newVal = parseInt(value, 10);
            if (isNaN(newVal) || newVal < 0) newVal = 0;
            if (newVal > 999) newVal = 999;
            document.getElementById(`input-${brandKey}-${unit}`).value = newVal;
            commitChange(brandKey, unit, newVal);
        }

        function reannounce(brandKey, unit) {
            const val = document.getElementById(`input-${brandKey}-${unit}`).value;
            const ts = Date.now();
            try {
                localStorage.setItem('queueUpdate', JSON.stringify({ brand: brandKey, unit, val, forceReannounce: true, ts: ts }));
            } catch (e) {}
            dataStore.reannounce = { brand: brandKey, unit, ts: ts };
            backgroundSave();
        }

        function commitChange(brandKey, unit, val) {
            if (!dataStore.queues[brandKey]) dataStore.queues[brandKey] = {};
            dataStore.queues[brandKey][unit] = val;

            try {
                localStorage.setItem('queueUpdate', JSON.stringify({ brand: brandKey, unit, val, ts: Date.now() }));
            } catch (e) {}
            backgroundSave();
        }

        function backgroundSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                afSaveState(dataStore);
            }, 500);
        }

        // --------- RESET ALL CONFIRMATION ---------
        let resetStep = 0;

        function startResetConfirmation() {
            resetStep = 1;
            document.getElementById('reset-modal-title').textContent = 'Reset all queue values to zero?';
            document.getElementById('reset-modal-message').textContent = 'This cannot be undone. All unit counters will be cleared.';
            document.getElementById('reset-modal-confirm-btn').textContent = 'Yes, continue';
            document.getElementById('reset-modal-confirm-btn').style.background = '#dc2626';
            document.getElementById('reset-modal').style.display = 'flex';
        }

        function confirmResetStep() {
            if (resetStep === 1) {
                resetStep = 2;
                document.getElementById('reset-modal-title').textContent = 'Final confirmation';
                document.getElementById('reset-modal-message').textContent = 'This will immediately reset every unit to 00. Proceed?';
                document.getElementById('reset-modal-confirm-btn').textContent = 'Reset everything';
                document.getElementById('reset-modal-confirm-btn').style.background = '#b91c1c';
            } else if (resetStep === 2) {
                Object.keys(dataStore.queues).forEach(brandKey => {
                    Object.keys(dataStore.queues[brandKey]).forEach(unit => {
                        setQueue(brandKey, parseInt(unit, 10), 0);
                    });
                });
                cancelResetConfirmation();
            }
        }

        function cancelResetConfirmation() {
            resetStep = 0;
            document.getElementById('reset-modal').style.display = 'none';
        }

        // INIT
        fetchInitialData();
    </script>
</body>

</html>
