<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Test Drive Registration</title>
  <style>
    body{margin:0;background:#0b1220;color:#edf2f7;font:16px system-ui,sans-serif}
    main{max-width:560px;margin:2rem auto;padding:24px;background:#172033;border-radius:16px}
    label{display:block;margin:16px 0}input:not([type=checkbox]),select,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:8px;margin-top:6px}
    button{background:#d71920;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}
    [hidden]{display:none!important}.consent{white-space:pre-wrap;max-height:320px;overflow:auto;padding:12px;background:#0b1220}
    #message{color:#ffcf7d;white-space:pre-line}nav{display:flex;gap:12px}#back{background:#46536c}
  </style>
</head><body><main>
  <h1>Test Drive Registration</h1><p id="progress"></p><p id="message" role="status">Loading registration…</p>
  <form id="registration" hidden novalidate>
    <section data-step="0"><h2>Client details</h2>
      <label>Email Address<input type="email" name="email" autocomplete="email" maxlength="320" required></label>
      <label>Name (Firstname Lastname)<input name="fullName" autocomplete="name" maxlength="160" required></label>
      <label>City Address<input name="cityAddress" autocomplete="address-level2" maxlength="240" required></label>
      <label>Contact No.<input name="contactNumber" type="tel" autocomplete="tel" maxlength="40" required></label>
    </section>
    <section data-step="1" hidden><h2>Unit to Test Drive</h2><p>Select one or more vehicle models.</p><div id="models"></div>
      <label>For Application? (optional)<select name="forApplication"><option value="">Not selected</option><option>Yes</option><option>No</option></select></label>
      <label>For Reservation? (optional)<select name="forReservation"><option value="">Not selected</option><option>Yes</option><option>No</option></select></label>
    </section>
    <section data-step="2" hidden><h2>Waiver</h2><div id="waiver" class="consent"></div>
      <label><input type="checkbox" name="waiverAccepted" required> I have read and accept the waiver.</label>
      <h2>Terms and Conditions</h2><div id="terms" class="consent"></div>
      <label><input type="checkbox" name="termsAccepted" required> I have read and accept the Terms and Conditions.</label>
    </section>
    <section data-step="3" hidden><h2>Sales Executive</h2>
      <label>SE unique code<input name="seCode" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" required></label>
      <button id="validate-code" type="button">Check code</button><p id="se-details"></p>
    </section>
    <nav><button id="back" type="button" hidden>Back</button><button id="next" type="button">Next</button><button id="submit" type="submit" hidden disabled>Submit</button></nav>
  </form><div id="result"></div>
  <script src="test-drive-registration.js"></script>
</main></body></html>
