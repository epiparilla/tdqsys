<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Drive Registration</title><style>body{margin:0;background:#0b1220;color:#edf2f7;font:16px system-ui,sans-serif}.card{max-width:560px;margin:2rem auto;padding:1.5rem;background:#172033;border-radius:16px}label{display:block;margin:.8rem 0;font-weight:700}input,button{box-sizing:border-box;width:100%;margin-top:.3rem;padding:.75rem;border-radius:8px;border:1px solid #536078;font:inherit}button{background:#d71920;color:#fff;border:0;font-weight:800}.hidden{display:none}.models label{font-weight:400}.error{color:#ffb4b4}</style></head><body><main class="card"><h1>Test Drive Registration</h1><p id="status">Loading registration...</p><form id="form" class="hidden"><section data-step="1"><label>Email Address<input type="email" name="email" required></label><label>Name (Firstname Lastname)<input name="fullName" required></label><label>City Address<input name="cityAddress" required></label><label>Contact No.<input name="contactNumber" required></label></section><section data-step="2" class="hidden"><h2>Unit to Test Drive</h2><div id="models" class="models"></div><label>For Application?<select name="forApplication"><option value="">Not selected</option><option>Yes</option><option>No</option></select></label><label>For Reservation?<select name="forReservation"><option value="">Not selected</option><option>Yes</option><option>No</option></select></label></section><section data-step="3" class="hidden"><h2>Waiver</h2><p id="waiver"></p><label><input type="checkbox" name="waiverAccepted"> I accept the waiver.</label><h2>Terms and Conditions</h2><p id="terms"></p><label><input type="checkbox" name="termsAccepted"> I accept the Terms and Conditions.</label></section><section data-step="4" class="hidden"><label>Sales Executive unique code<input name="seCode" inputmode="numeric" maxlength="4" required></label><p id="se"></p></section><button id="next" type="button">Next</button><button id="submit" type="submit" class="hidden">Submit</button></form></main><script>
const id=new URL(location.href).searchParams.get('id')||'', form=document.querySelector('#form'), status=document.querySelector('#status');let step=1;function show(){document.querySelectorAll('[data-step]').forEach(x=>x.classList.toggle('hidden',+x.dataset.step!==step));next.classList.toggle('hidden',step===4);submit.classList.toggle('hidden',step!==4)}
fetch('/api/test-drive/config?id='+encodeURIComponent(id)).then(r=>r.json()).then(c=>{if(c.error)throw Error(c.error);models.innerHTML=c.models.map(m=>`<label><input type="checkbox" name="modelIds" value="${m.id}"> ${m.name}</label>`).join('');waiver.textContent=c.waiverStatement;terms.textContent=c.termsAndConditions;status.remove();form.classList.remove('hidden')}).catch(e=>status.textContent=e.message);
next.onclick=()=>{if(step===2&&!document.querySelector('input[name=modelIds]:checked'))return alert('Select at least one vehicle model.');if(step===3&&(!form.waiverAccepted.checked||!form.termsAccepted.checked))return alert('Accept the waiver and Terms and Conditions.');step++;show()};form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{const r=await fetch('/api/test-drive/registrations',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({instanceId:id,fullName:form.fullName.value,email:form.email.value,cityAddress:form.cityAddress.value,contactNumber:form.contactNumber.value,forApplication:form.forApplication.value,forReservation:form.forReservation.value,seCode:form.seCode.value,modelIds:[...document.querySelectorAll('input[name=modelIds]:checked')].map(x=>x.value),waiverAccepted:form.waiverAccepted.checked,termsAccepted:form.termsAccepted.checked,waiverVersion:'current',termsVersion:'current'})});const d=await r.json();if(!r.ok)throw Error(d.error||'Registration failed.');form.innerHTML='<h2>Registration received</h2><p>'+d.entries.map(x=>'Queue number: '+x.queueNumber).join('<br>')+'</p><p>'+d.message+'</p>'}catch(err){alert(err.message)}finally{submit.disabled=false}};
</script></body></html>
